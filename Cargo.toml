[package]
name = "dakkabot"
version = "0.1.5"
edition = "2021"
description = "Bot Discord 100 % privé pour contrôler finement un VPS (local ou SSH) : statut réel, gestion systemd applicative, reboot propriétaire, logs"
license = "MIT"
repository = "https://github.com/ApachaiZ/DakkaBot"

# L'exécutable s'appelle dkbot (plus court à taper) — le PROJET s'appelle
# DakkaBot (crate `dakkabot`).
[[bin]]
name = "dkbot"
path = "src/main.rs"

# ── Profil release ──
# opt-level 3 = défaut release ; lto thin + codegen-units 1 = binaire plus
# petit et plus rapide au prix d'un lien plus long. Pas de `panic = "abort"` :
# poise contient les panics des commandes (catch_unwind) — un bug dans UNE
# commande tue sa tâche, pas le bot.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
members = [".", "plugins/dummy-plugin"]
default-members = ["."]

[dependencies]
# ── Runtime asynchrone (features réduites au strict nécessaire) ───────────
tokio = { version = "1", features = [
    "rt-multi-thread", # exécuteur
    "macros",          # tokio::main, tokio::select!
    "time",            # sleep, timeout, backoff
    "signal",          # SIGTERM/SIGINT
    "sync",            # mpsc, watch, OnceCell, Mutex
    "process",         # exécution locale (collecte de statut, systemctl)
] }

# ── Discord ────────────────────────────────────────────────────────────────
# poise = framework de slash-commands construit sur serenity. La version 0.6
# ré-exporte serenity 0.12 via `poise::serenity_prelude`.
poise = "0.6"

# ── SSH (cible distante) ───────────────────────────────────────────────────
# russh = SSH client PUR RUST (async, zéro dépendance C) — cohérent avec la
# philosophie « binaire unique sans dépendance système » du projet. Le
# backend crypto `ring` (déjà utilisé par rustls) évite aws-lc-rs ; `rsa`
# couvre les clés d'hôte RSA courantes sur les VPS.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }

# ── Données & sérialisation ─────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

# ── Mise à jour du binaire (`dkbot update`) ───────────────────────────────
# HTTP pur Rust (rustls) : téléchargement des releases GitHub + vérification
# SHA-256 — cohérent avec la philosophie « zéro dépendance système ».
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# ── Crypto (chiffrement au repos des fichiers d'état) ─────────────────────
aes-gcm = "0.10"   # AES-256-GCM (users.json, sessions.json, roster)
sha2 = "0.10"      # SHA-256 (dérivation de clé depuis le token)
rand = "0.8"       # IV aléatoires (OsRng = /dev/urandom)
base64 = "0.22"    # encodage base64 du blob chiffré

# ── Configuration & outils ─────────────────────────────────────────────────
dotenvy = "0.15"          # lit .config.d/.env
unicode-width = "0.2"     # largeur visuelle des emojis (bannière alignée)
dialoguer = "0.11"        # prompts interactifs du setup
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # horodatage des logs
futures = "0.3"           # StreamExt (collecteurs de boutons Discord)

# ── Gestion d'erreurs ──────────────────────────────────────────────────────
anyhow = "1"
thiserror = "2"

[dev-dependencies]
# La suite utilise le testeur intégré de Cargo : aucun réseau, aucun fichier
# hors d'un dossier temporaire.

[target."cfg(unix)".dependencies]
libc = "0.2"
