name: Release

# Publie une release GitHub à chaque tag v* : binaires STATIQUES musl pour
# x86_64 et aarch64 + sommes SHA-256 (vérifiées par `dkbot update`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: houseabsolute/actions-rust-cross@v0
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release --locked

      - name: Renommer + somme
        run: |
          cp "target/${{ matrix.target }}/release/dkbot" "dkbot-${{ matrix.target }}"
          sha256sum "dkbot-${{ matrix.target }}" > "dkbot-${{ matrix.target }}.sha256"
          ls -la dkbot-*

      - uses: actions/upload-artifact@v4
        with:
          name: dkbot-${{ matrix.target }}
          path: dkbot-${{ matrix.target }}*

  release:
    name: Publier la release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/dkbot-*
